      <a href="cart.html">购物车</a>

  </div>
</div>

<header class="main-header">
  <div class="container header-inner">
    <div class="logo"><a href="index.html"><div class="logo-icon">🍑</div>宝淘</a></div>
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="搜索商品...">
      <button id="searchBtn">搜索</button>
    </div>
    <div class="header-actions">
      <div id="headerUserArea"><a href="login.html">登录</a> | <a href="register.html">注册</a></div>

      <span class="current" id="bcName">商品详情</span>

    <div id="productDetail">
      <div class="loading-wrap"><div class="spinner"></div><span>加载商品信息...</span></div>

    <!-- 推荐商品 -->
    <div class="related-section">
      <div class="section-header">
        <h3 class="section-title">相关推荐</h3>
      </div>
      <div class="product-grid" id="relatedGrid">
        <div class="loading-wrap" style="grid-column:1/-1"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

<footer class="main-footer">
  <div class="container">
    <div class="footer-top">
      <div class="footer-col"><h4>购物指南</h4><a href="help.html#shopping-flow">购物流程</a><a href="help.html#member-rights">会员权益</a></div>
