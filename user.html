<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 - 宝淘</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/user.css">
</head>
<body>

<div class="notice-bar">
  <div class="container flex-between">
    <span>欢迎来到宝淘！</span>
    <div class="notice-links">
      <a href="index.html">首页</a><a href="cart.html">购物车</a>
    </div>
  </div>
</div>

<header class="main-header">
  <div class="container header-inner">
    <div class="logo"><a href="index.html"><div class="logo-icon">🍑</div>宝淘</a></div>
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="搜索商品...">
      <button id="searchBtn">搜索</button>
    </div>
    <div class="header-actions">
      <div id="headerUserArea"><a href="login.html">登录</a> | <a href="register.html">注册</a></div>
      <a href="cart.html" class="cart-btn">🛒 购物车 <span class="cart-count" id="cartCount" style="display:none">0</span></a>
    </div>
  </div>
</header>

<main class="user-main">
  <div class="container">
    <div class="user-layout">

      <!-- 左侧菜单 -->
      <aside class="user-sidebar">
        <div class="user-profile-brief" id="profileBrief">
          <div class="loading-wrap" style="padding:20px"><div class="spinner"></div></div>
        </div>
        <nav class="user-nav" id="userNav">
          <a href="#orders" class="nav-item active" data-tab="orders">我的订单</a>
          <a href="#profile" class="nav-item" data-tab="profile">个人信息</a>
        </nav>
      </aside>

      <!-- 右侧内容 -->
      <div class="user-content">

        <!-- 我的订单 -->
        <div class="user-panel active" id="panel-orders">
          <div class="panel-header flex-between">
            <h2>我的订单</h2>
          </div>
          <div class="tabs" id="orderStatusTabs">
            <div class="tab-item active" data-status="">全部</div>
            <div class="tab-item" data-status="pending">待付款</div>
            <div class="tab-item" data-status="paid">待发货</div>
            <div class="tab-item" data-status="shipped">待收货</div>
            <div class="tab-item" data-status="completed">已完成</div>
            <div class="tab-item" data-status="cancelled">已取消</div>
          </div>
          <div id="orderList">
            <div class="loading-wrap"><div class="spinner"></div></div>
          </div>
        </div>

        <!-- 个人信息 -->
        <div class="user-panel" id="panel-profile">
          <div class="panel-header"><h2>个人信息</h2></div>
          <form id="profileForm" novalidate>
            <div class="form-group">
              <label class="form-label">用户名</label>
              <input type="text" class="form-input" id="profileUsername" disabled>
            </div>
            <div class="form-group">
              <label class="form-label">昵称</label>
              <input type="text" class="form-input" id="profileNickname" placeholder="请输入昵称">
            </div>
            <div class="form-group">
              <label class="form-label">手机号</label>
              <input type="tel" class="form-input" id="profilePhone" placeholder="请输入手机号">
            </div>
            <div class="form-group">
              <label class="form-label">邮箱</label>
              <input type="email" class="form-input" id="profileEmail" placeholder="请输入邮箱">
            </div>
            <button type="submit" class="btn btn-primary" id="saveProfileBtn">保存修改</button>
          </form>
        </div>

        <!-- 我的商品 (卖家/管理员) -->
        <div class="user-panel" id="panel-my-products">
          <div class="panel-header flex-between">
            <h2>我的商品</h2>
            <button class="btn btn-primary btn-sm" onclick="showAddProduct()">+ 发布商品</button>
          </div>
          <div id="myProductList">
            <div class="loading-wrap"><div class="spinner"></div></div>
          </div>
        </div>

        <!-- 发布/编辑商品 表单 -->
        <div class="user-panel" id="panel-add-product">
          <div class="panel-header flex-between">
            <h2 id="productFormTitle">发布商品</h2>
            <button class="btn btn-sm btn-outline" onclick="showPanel('my-products')">← 返回</button>
          </div>
          <form id="productForm" enctype="multipart/form-data" novalidate>
            <input type="hidden" id="editProductId">
            <div class="form-row-2">
              <div class="form-group">
                <label class="form-label">商品名称 <span class="required">*</span></label>
                <input id="pName" type="text" class="form-input" placeholder="请输入商品名称">
                <p class="form-error" id="errPName"></p>
              </div>
              <div class="form-group">
                <label class="form-label">商品分类 <span class="required">*</span></label>
                <select id="pCategory" class="form-input">
                  <option value="">请选择分类</option>
                </select>
                <p class="form-error" id="errPCategory"></p>
              </div>
            </div>
            <div class="form-row-2">
              <div class="form-group">
                <label class="form-label">售价 (¥) <span class="required">*</span></label>
                <input id="pPrice" type="number" step="0.01" class="form-input" placeholder="0.00">
                <p class="form-error" id="errPPrice"></p>
              </div>
              <div class="form-group">
                <label class="form-label">原价 (¥)</label>
                <input id="pOriginalPrice" type="number" step="0.01" class="form-input" placeholder="0.00">
              </div>
            </div>
            <div class="form-row-2">
              <div class="form-group">
                <label class="form-label">库存数量</label>
                <input id="pStock" type="number" class="form-input" value="999">
              </div>
              <div class="form-group">
                <label class="form-label">商品状态</label>
                <select id="pStatus" class="form-input">
                  <option value="1">上架</option>
                  <option value="0">下架</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">商品图片</label>
              <input id="pImage" type="file" accept="image/*" class="form-input">
              <p style="font-size:12px;color:var(--text-muted);margin-top:4px">支持 JPG/PNG，最大5MB</p>
            </div>
            <div class="form-group">
              <label class="form-label">商品描述</label>
              <textarea id="pDesc" class="form-input" rows="4" placeholder="详细描述商品特点..."></textarea>
            </div>
            <div style="display:flex;gap:12px">
              <button type="submit" class="btn btn-primary" id="saveProductBtn">保存发布</button>
              <button type="button" class="btn btn-outline" onclick="showPanel('my-products')">取消</button>
            </div>
          </form>
        </div>

        <!-- 用户管理 (管理员) -->
        <div class="user-panel" id="panel-all-users">
          <div class="panel-header"><h2>用户管理</h2></div>
          <div id="userList">
            <div class="loading-wrap"><div class="spinner"></div></div>
          </div>
        </div>

      </div>
    </div>
  </div>
</main>

<footer class="main-footer">
  <div class="container footer-bottom">
    <p>© 2024 宝淘 | 仅供学习使用</p>
    <p class="student-info">学号：****** &nbsp;|&nbsp; 姓名：******</p>
  </div>
</footer>

<script src="js/common.js"></script>
<script src="js/user.js"></script>
</body>
</html>
