<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 - 宝淘</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

<header class="auth-header">
  <div class="container flex-between">
    <a href="index.html" class="logo-link">
      <div class="logo-icon">🍑</div>
      <span>宝淘</span>
    </a>
    <span class="auth-slogan">注册即享超值优惠</span>
  </div>
</header>

<main class="auth-main">
  <div class="auth-card auth-card-wide">
    <div class="auth-tabs">
      <div class="tab-item active">新用户注册</div>
    </div>

    <form id="registerForm" novalidate>
      <!-- 角色选择 -->
      <div class="form-group">
        <label class="form-label">注册角色 <span class="required">*</span></label>
        <div class="role-select">
          <label class="role-option active" data-role="buyer">
            <input type="radio" name="role" value="buyer" checked hidden>
            <span class="role-icon">🛒</span>
            <span class="role-name">买家</span>
            <span class="role-desc">享受购物</span>
          </label>
          <label class="role-option" data-role="seller">
            <input type="radio" name="role" value="seller" hidden>
            <span class="role-icon">🏪</span>
            <span class="role-name">卖家</span>
            <span class="role-desc">开店卖货</span>
          </label>
        </div>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label">用户名 <span class="required">*</span></label>
          <input id="regUsername" type="text" class="form-input" placeholder="3-20个字符">
          <p class="form-error" id="errRegUsername"></p>
        </div>
        <div class="form-group">
          <label class="form-label">昵称</label>
          <input id="regNickname" type="text" class="form-input" placeholder="显示名称(可选)">
        </div>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label">密码 <span class="required">*</span></label>
          <div class="pwd-wrap">
            <input id="regPassword" type="password" class="form-input" placeholder="至少6个字符">
            <button type="button" class="pwd-toggle" id="regPwdToggle">👁</button>
          </div>
          <p class="form-error" id="errRegPassword"></p>
        </div>
        <div class="form-group">
          <label class="form-label">确认密码 <span class="required">*</span></label>
          <div class="pwd-wrap">
            <input id="regConfirm" type="password" class="form-input" placeholder="再次输入密码">
            <button type="button" class="pwd-toggle" id="regConfirmToggle">👁</button>
          </div>
          <p class="form-error" id="errRegConfirm"></p>
        </div>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label">手机号</label>
          <input id="regPhone" type="tel" class="form-input" placeholder="11位手机号(可选)">
          <p class="form-error" id="errRegPhone"></p>
        </div>
        <div class="form-group">
          <label class="form-label">邮箱</label>
          <input id="regEmail" type="email" class="form-input" placeholder="邮箱地址(可选)">
          <p class="form-error" id="errRegEmail"></p>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="registerBtn">立即注册</button>
    </form>

    <div class="auth-footer-links">
      <span>已有账号？</span>
      <a href="login.html">直接登录</a>
    </div>
  </div>
</main>

<footer class="main-footer" style="margin-top:0">
  <div class="container footer-bottom">
    <p>© 2024 宝淘 | 仅供学习使用</p>
    <p class="student-info">学号：****** &nbsp;|&nbsp; 姓名：******</p>
  </div>
</footer>

<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
