<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝淘 - 全球最大的网上购物平台</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/index.css">
</head>
<body>

<!-- 顶部通知栏 -->
<div class="notice-bar">
  <div class="container">
    <span>欢迎来到宝淘！</span>
    <div class="notice-links">
      <a href="login.html">请登录</a>
      <a href="register.html">免费注册</a>
      <a href="user.html">我的淘宝</a>
      <a href="cart.html">购物车</a>
    </div>
  </div>
</div>

<!-- 主导航 -->
<header class="main-header">
  <div class="container header-inner">
    <div class="logo">
      <a href="index.html">
        <div class="logo-icon">🍑</div>
        宝淘
      </a>
    </div>
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="搜索商品、品牌、店铺...">
      <button id="searchBtn">搜索</button>
    </div>
    <div class="header-actions">
      <div id="headerUserArea"><a href="login.html">登录</a> | <a href="register.html">注册</a></div>
      <a href="cart.html" class="cart-btn">
        🛒 购物车
        <span class="cart-count" id="cartCount" style="display:none">0</span>
      </a>
    </div>
  </div>
</header>

<!-- 分类导航 -->
<nav class="category-nav">
  <div class="container" id="categoryNav">
    <a href="index.html" class="active">全部商品</a>
  </div>
</nav>

<!-- 主内容 -->
<main>

  <!-- 轮播图 + 侧边分类 -->
  <div class="hero-section">
    <div class="container">
      <div class="hero-layout">

        <!-- 侧边分类菜单 -->
        <aside class="side-categories" id="sideCategories">
          <div class="loading-wrap"><div class="spinner"></div></div>
        </aside>

        <!-- 轮播图 -->
        <div class="carousel-wrap">
          <div class="carousel" id="carousel">
            <div class="carousel-track" id="carouselTrack">
              <div class="carousel-slide"><img src="images/banners/banner1.jpg" alt="超值好货"></div>
              <div class="carousel-slide"><img src="images/banners/banner2.jpg" alt="品牌特卖"></div>
              <div class="carousel-slide"><img src="images/banners/banner3.jpg" alt="限时折扣"></div>
            </div>
            <button class="carousel-btn prev" id="carouselPrev">‹</button>
            <button class="carousel-btn next" id="carouselNext">›</button>
            <div class="carousel-dots" id="carouselDots"></div>
          </div>

          <!-- 快速功能入口 -->
          <div class="quick-links">
            <a href="cart.html" class="quick-link">
              <span class="ql-icon">🛒</span>
              <span>购物车</span>
            </a>
            <a href="user.html" class="quick-link">
              <span class="ql-icon">👤</span>
              <span>我的账户</span>
            </a>
            <a href="user.html#orders" class="quick-link">
              <span class="ql-icon">📦</span>
              <span>我的订单</span>
            </a>
            <a href="index.html?sort=sales" class="quick-link">
              <span class="ql-icon">🔥</span>
              <span>特卖区</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 商品分类展示 -->
  <section class="section-categories" id="categories">
    <div class="container">
      <div class="section-header">
        <h2 class="section-title">商品分类</h2>
      </div>
      <div class="category-grid" id="categoryGrid">
        <div class="loading-wrap"><div class="spinner"></div></div>
      </div>
    </div>
  </section>

  <!-- 推荐商品 -->
  <section class="section-products">
    <div class="container">
      <div class="section-header flex-between">
        <h2 class="section-title">
          <span id="sectionTitleText">猜你喜欢</span>
        </h2>
        <div class="sort-bar">
          <span class="sort-btn active" data-sort="sales">销量优先</span>
          <span class="sort-btn" data-sort="price_asc">价格从低</span>
          <span class="sort-btn" data-sort="price_desc">价格从高</span>
          <span class="sort-btn" data-sort="newest">最新上架</span>
        </div>
      </div>
      <div class="product-grid" id="productGrid">
        <div class="loading-wrap" style="grid-column:1/-1"><div class="spinner"></div></div>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </section>

</main>

<!-- 页脚 -->
<footer class="main-footer">
  <div class="container">
    <div class="footer-top">
      <div class="footer-col">
        <h4>购物指南</h4>
        <a href="help.html#register-guide">免费注册</a>
        <a href="help.html#member-rights">会员权益</a>
        <a href="help.html#shopping-flow">购物流程</a>
      </div>
      <div class="footer-col">
        <h4>配送服务</h4>
        <a href="help.html#delivery-methods">配送方式</a>
        <a href="help.html#self-pickup">上门自提</a>
        <a href="help.html#shipping-fee">运费说明</a>
      </div>
      <div class="footer-col">
        <h4>售后服务</h4>
        <a href="help.html#refund-guide">退款说明</a>
        <a href="help.html#return-policy">退换货政策</a>
        <a href="help.html#repair-service">维修服务</a>
      </div>
      <div class="footer-col">
        <h4>关于宝淘</h4>
        <a href="help.html#about-us">关于我们</a>
        <a href="help.html#contact-us">联系我们</a>
        <a href="help.html#legal-notice">法律声明</a>
      </div>
    </div>
    <div class="footer-bottom">
      <p>© 2024 宝淘 版权所有 | 仅供学习交流使用</p>
      <p class="student-info">学号：****** &nbsp;|&nbsp; 姓名：******</p>
    </div>
  </div>
</footer>

<script src="js/common.js"></script>
<script src="js/home.js"></script>
</body>
</html>
